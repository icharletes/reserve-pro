name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una ejecución nueva sobre la misma rama cancela la anterior (ahorra minutos y evita resultados viejos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el workflow solo lee el repositorio.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, tipos, build y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reservepro
          POSTGRES_USER: rp_owner
          POSTGRES_PASSWORD: rp_owner_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rp_owner -d reservepro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # BullMQ exige `noeviction` (con otra política Redis podría descartar jobs): no se puede pasar como
      # servicio, así que se arranca aparte.
      - name: Redis (noeviction)
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --maxmemory-policy noeviction
          for i in $(seq 1 30); do docker exec redis redis-cli ping | grep -q PONG && exit 0; sleep 1; done
          echo "Redis no respondió" >&2; exit 1

      # Mismo script que usa Docker Compose en local: roles rp_app (sujeto a RLS) y rp_system (BYPASSRLS).
      - name: Roles y extensiones de PostgreSQL
        env:
          PGHOST: localhost
          PGPASSWORD: rp_owner_dev
          POSTGRES_USER: rp_owner
          POSTGRES_DB: reservepro
          RP_APP_PASSWORD: rp_app_dev
          RP_SYSTEM_PASSWORD: rp_system_dev
        run: bash docker/postgres/init/01-roles-and-extensions.sh

      - uses: pnpm/action-setup@v4 # versión tomada de "packageManager" en package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Entorno de pruebas (valores efímeros de CI)
        run: cp .env.example .env

      - name: Lint (incluye las reglas de arquitectura y seguridad)
        run: pnpm exec eslint . --max-warnings 0
      - name: Formato
        run: pnpm format:check
      - name: Tipos
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Pruebas (base de datos y Redis reales)
        run: pnpm test

      # El esquema de Prisma se genera desde la base de datos (db pull). Si alguien añadió una migración y no
      # versionó el schema regenerado, el cliente tipado quedaría desfasado de la base real.
      - name: El schema.prisma coincide con las migraciones
        working-directory: packages/database
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma db pull
          git diff --exit-code prisma/schema.prisma

      # El contrato OpenAPI versionado debe coincidir con el código (también lo comprueba un test).
      - name: OpenAPI al día
        run: |
          pnpm --filter @reservepro/api openapi:generate
          git diff --exit-code docs/api/openapi.json

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Informativa por ahora: una vulnerabilidad nueva de un tercero no debe bloquear todos los PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
